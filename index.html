<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Convite</title>

  <link rel="stylesheet" href="styles/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>
  <div id="app">
    <aside>
      <div class="aside-container">
        <img src="/assets/icons/Logo.svg" alt="Logo do Formulário de Convite">
        <h1>Festivite</h1>
        <p>Crie um convite digital para o seu evento</p>
      </div>
    </aside>

    <main>
      <div class="main-container">
        <h1>Crie seu convite</h1>
        <div class="calendar">
          <img src="/assets/icons/calendar.svg" alt="icone de calendário">
          <span>Sobre o evento</span>
        </div>

        <form method="post" enctype="multipart/form-data">
          <fieldset class="about">
            <div class="input-wrapper">
              <label for="title">Título</label>
              <input id="title" type="text"
              placeholder="Nome do evento">
            </div>

            <div class="input-wrapper">
              <label for="start-date">Início</label>
              <input id="start-date" type="date" lang="pt-BR">
            </div>

            <div class="input-wrapper">
              <label for="end-date">Fim</label>
              <input id="end-date" type="date" lang="pt-BR">
            </div>

            <div class="select-wrapper">
              <label for=""></label></div>













            </fieldset>
          </form>

        </div>
    </main>












  </div>
</body>
</html>
