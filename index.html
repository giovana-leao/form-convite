<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Convite</title>

    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&family=Leckerli+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <aside>
        <div class="aside-container">
          <img
            src="/assets/icons/Logo.svg"
            alt="Logo do Formulário de Convite"
          />
          <h1>Festivite</h1>
          <p>Crie um convite digital para o seu evento</p>
        </div>
      </aside>

      <main>
        <div class="main-container">
          <h1>Crie seu convite</h1>
          <div class="icon-title">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M8 1.25C8.41421 1.25 8.75 1.58579 8.75 2V3.25H15.25V2C15.25 1.58579 15.5858 1.25 16 1.25C16.4142 1.25 16.75 1.58579 16.75 2V3.25H19C20.5188 3.25 21.75 4.48122 21.75 6V20C21.75 21.5188 20.5188 22.75 19 22.75H5C3.48122 22.75 2.25 21.5188 2.25 20V6C2.25 4.48122 3.48122 3.25 5 3.25H7.25V2C7.25 1.58579 7.58579 1.25 8 1.25ZM7.25 4.75H5C4.30964 4.75 3.75 5.30964 3.75 6V9.25H20.25V6C20.25 5.30964 19.6904 4.75 19 4.75H16.75V6C16.75 6.41421 16.4142 6.75 16 6.75C15.5858 6.75 15.25 6.41421 15.25 6V4.75H8.75V6C8.75 6.41421 8.41421 6.75 8 6.75C7.58579 6.75 7.25 6.41421 7.25 6V4.75ZM20.25 10.75H3.75V20C3.75 20.6904 4.30964 21.25 5 21.25H19C19.6904 21.25 20.25 20.6904 20.25 20V10.75Z"
                fill="#869198"
              />
            </svg>

            <span>Sobre o evento</span>
          </div>

          <form method="post" enctype="multipart/form-data">
            <fieldset class="about">
              <div class="input-wrapper">
                <label for="title">Título</label>
                <input id="title" type="text" placeholder="Nome do evento" />
              </div>

              <div class="flex">
                <div class="input-wrapper flex-1">
                  <label for="start-date">Início</label>
                  <input
                    id="start-date"
                    type="text"
                    placeholder="DD/MM/AAAA, --:--"
                  />
                </div>

                <div class="input-wrapper flex-1">
                  <label for="end-date">Fim</label>
                  <input
                    id="end-date"
                    type="text"
                    placeholder="DD/MM/AAAA, --:--"
                  />
                </div>

                <div class="input-wrapper flex-1">
                  <span class="label-title">Tipo</span>
                  <div class="segmented-control">
                    <input
                      type="radio"
                      id="tipo-presencial"
                      name="tipo-evento"
                      checked
                    />
                    <label for="tipo-presencial">
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M3 21h18"></path>
                        <path d="M9 8h1"></path>
                        <path d="M9 12h1"></path>
                        <path d="M9 16h1"></path>
                        <path d="M14 8h1"></path>
                        <path d="M14 12h1"></path>
                        <path d="M14 16h1"></path>
                        <path
                          d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"
                        ></path>
                      </svg>
                      Presencial</label
                    >
                    <input type="radio" id="tipo-online" name="tipo-evento" />
                    <label for="tipo-online">
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect
                          x="1"
                          y="5"
                          width="15"
                          height="14"
                          rx="2"
                          ry="2"
                        ></rect>
                      </svg>
                      Online</label
                    >
                  </div>
                </div>

                <div class="input-wrapper flex-1">
                  <label for="location">Local</label>
                  <input
                    id="location"
                    type="text"
                    placeholder="Link ou endereço"
                  />
                </div>
              </div>

              <div class="textarea-wrapper">
                <label for="description">Descrição</label>
                <textarea
                  name="description"
                  id="description"
                  cols="30"
                  rows="5"
                  placeholder="Escreva sobre os detalhes do evento"
                ></textarea>
              </div>
            </fieldset>

            <div class="icon-title">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M7 2.75C6.9337 2.75 6.87011 2.77634 6.82322 2.82322C6.77634 2.87011 6.75 2.9337 6.75 3V11.25H17.25V3C17.25 2.93369 17.2237 2.87011 17.1768 2.82322C17.1299 2.77634 17.0663 2.75 17 2.75H14.75V6C14.75 6.41421 14.4142 6.75 14 6.75C13.5858 6.75 13.25 6.41421 13.25 6V2.75H10.75V4C10.75 4.41421 10.4142 4.75 10 4.75C9.58579 4.75 9.25 4.41421 9.25 4V2.75H7ZM7 1.25C6.53587 1.25 6.09075 1.43437 5.76256 1.76256C5.43437 2.09075 5.25 2.53587 5.25 3V11.4189C5.07072 11.5039 4.90555 11.6196 4.76256 11.7626C4.43438 12.0908 4.25 12.5359 4.25 13V14C4.25 14.7293 4.53973 15.4288 5.05546 15.9445C5.57118 16.4603 6.27065 16.75 7 16.75H9C9.06631 16.75 9.12989 16.7763 9.17678 16.8232C9.22366 16.8701 9.25 16.9337 9.25 17V19.9C9.25 20.6293 9.53973 21.3288 10.0555 21.8445C10.5712 22.3603 11.2707 22.65 12 22.65C12.7293 22.65 13.4288 22.3603 13.9445 21.8445C14.4603 21.3288 14.75 20.6293 14.75 19.9V17C14.75 16.9337 14.7763 16.8701 14.8232 16.8232C14.8701 16.7763 14.9337 16.75 15 16.75H17C17.7293 16.75 18.4288 16.4603 18.9445 15.9445C19.4603 15.4288 19.75 14.7293 19.75 14V13C19.75 12.5359 19.5656 12.0908 19.2374 11.7626C19.0945 11.6196 18.9293 11.5039 18.75 11.4189V3C18.75 2.53587 18.5656 2.09075 18.2374 1.76256C17.9092 1.43437 17.4641 1.25 17 1.25H7ZM6 12.75C5.9337 12.75 5.87011 12.7763 5.82322 12.8232C5.77634 12.8701 5.75 12.9337 5.75 13V14C5.75 14.3315 5.8817 14.6495 6.11612 14.8839C6.35054 15.1183 6.66848 15.25 7 15.25H9C9.46413 15.25 9.90925 15.4344 10.2374 15.7626C10.5656 16.0908 10.75 16.5359 10.75 17V19.9C10.75 20.2315 10.8817 20.5495 11.1161 20.7839C11.3505 21.0183 11.6685 21.15 12 21.15C12.3315 21.15 12.6495 21.0183 12.8839 20.7839C13.1183 20.5495 13.25 20.2315 13.25 19.9V17C13.25 16.5359 13.4344 16.0908 13.7626 15.7626C14.0908 15.4344 14.5359 15.25 15 15.25H17C17.3315 15.25 17.6495 15.1183 17.8839 14.8839C18.1183 14.6495 18.25 14.3315 18.25 14V13C18.25 12.9337 18.2237 12.8701 18.1768 12.8232C18.1299 12.7763 18.0663 12.75 18 12.75H6Z"
                  fill="#869198"
                />
              </svg>

              <span>Personalizaçao</span>
            </div>
            <fieldset class="customization">
              <label>Cor principal</label>
              <div class="color-wrapper">
                <div class="color-picker">
                  <input type="radio" id="color-blue" name="primary-color" />
                  <label
                    for="color-blue"
                    style="background-color: #59b2ff"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-navy" name="primary-color" />
                  <label
                    for="color-navy"
                    style="background-color: #6a59ff"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-purple" name="primary-color" />
                  <label
                    for="color-purple"
                    style="background-color: #b259ff"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-fuschia" name="primary-color" />
                  <label
                    for="color-fuschia"
                    style="background-color: #ff59f9"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-pink" name="primary-color" />
                  <label
                    for="color-pink"
                    style="background-color: #ff598b"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-danger" name="primary-color" />
                  <label
                    for="color-danger"
                    style="background-color: #ff5959"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-orange" name="primary-color" />
                  <label
                    for="color-orange"
                    style="background-color: #ff8b59"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-yellow" name="primary-color" />
                  <label
                    for="color-yellow"
                    style="background-color: #ffcd59"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-lime" name="primary-color" />
                  <label
                    for="color-lime"
                    style="background-color: #e1ff59"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-green" name="primary-color" />
                  <label
                    for="color-green"
                    style="background-color: #59ff91"
                  ></label>
                </div>
                <div class="color-picker">
                  <input type="radio" id="color-cyan" name="primary-color" />
                  <label
                    for="color-cyan"
                    style="background-color: #59fff9"
                  ></label>
                </div>
              </div>

              <div class="input-wrapper">
                <label>Tema do evento</label>
                <div class="radio-wrapper">
                  <div class="radio-inner">
                    <input type="radio" id="birthday" name="theme" />
                    <img
                      src="assets/aniversario.png"
                      alt="imagem de bolo de aniversário"
                    />
                    <label for="birthday">Aniversário</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="children" name="theme" />
                    <img
                      src="assets/infantil.png"
                      alt="imagem de festa infantil"
                    />
                    <label for="children">Infantil</label>
                  </div>

                  <div class="radio-inner">
                    <input type="radio" id="graduation" name="theme" />
                    <img src="assets/formatura.png" alt="imagem de toga" />
                    <label for="graduation">Formatura</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="marriage" name="theme" />
                    <img src="assets/casamento.png" alt="imagem de alianças" />
                    <label for="marriage">Casamento</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="baby-shower" name="theme" />
                    <img
                      src="assets/cha-de-bebe.png"
                      alt="imagem de itens de bebê "
                    />
                    <label for="baby-shower">Chá de bebê</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="bridal-shower" name="theme" />
                    <img
                      src="assets/cha-de-panela.png"
                      alt="imagem de cozinha e utensílios domésticos "
                    />
                    <label for="bridal-shower">Chá de panela</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="carnival" name="theme" />
                    <img
                      src="assets/carnaval.png"
                      alt="imagem de itens de carnaval "
                    />
                    <label for="carnival">Carnaval</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="easter" name="theme" />
                    <img
                      src="assets/pascoa.png"
                      alt="imagem de coelho da páscoa"
                    />
                    <label for="easter">Páscoa</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="june-party" name="theme" />
                    <img
                      src="assets/sao-joao.png"
                      alt="imagem de bandeirinhas de festa junina"
                    />
                    <label for="june-party">São João</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="halloween" name="theme" />
                    <img
                      src="assets/halloween.png"
                      alt="imagem de abóbora de halloween"
                    />
                    <label for="halloween">Halloween</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="christmas" name="theme" />
                    <img
                      src="assets/natal.png"
                      alt="imagem de presentes de Natal"
                    />
                    <label for="christmas">Natal</label>
                  </div>
                  <div class="radio-inner">
                    <input type="radio" id="another" name="theme" />
                    <img
                      src="assets/outro.png"
                      alt="imagem brinde entre amigos "
                    />
                    <label for="another">Outro</label>
                  </div>
                </div>
              </div>

              <div class="form-row">
                <div class="input-wrapper">
                  <label class="field-title">Estilo</label>
                  <div class="switch-wrapper">
                    <input type="checkbox" id="theme-switch" />
                    <label for="theme-switch" class="switch-track">
                      <span class="switch-thumb"></span>
                    </label>
                    <span class="switch-text"></span>
                  </div>
                </div>

                <div class="input-wrapper">
                  <label class="field-title">Foto de capa</label>
                  <div class="file-input-wrapper">
                    <input type="file" id="cover-photo" class="sr-only" />
                    <label for="cover-photo" class="btn-upload">
                      <svg
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          fill-rule="evenodd"
                          clip-rule="evenodd"
                          d="M7.64645 1.64645C7.84171 1.45118 8.15829 1.45118 8.35355 1.64645L11.6869 4.97978C11.8821 5.17504 11.8821 5.49162 11.6869 5.68689C11.4916 5.88215 11.175 5.88215 10.9798 5.68689L8.5 3.20711V10C8.5 10.2761 8.27614 10.5 8 10.5C7.72386 10.5 7.5 10.2761 7.5 10V3.20711L5.02022 5.68689C4.82496 5.88215 4.50838 5.88215 4.31311 5.68689C4.11785 5.49162 4.11785 5.17504 4.31311 4.97978L7.64645 1.64645ZM2 9.5C2.27614 9.5 2.5 9.72386 2.5 10V12.6667C2.5 12.8877 2.5878 13.0996 2.74408 13.2559C2.90036 13.4122 3.11232 13.5 3.33333 13.5H12.6667C12.8877 13.5 13.0996 13.4122 13.2559 13.2559C13.4122 13.0996 13.5 12.8877 13.5 12.6667V10C13.5 9.72386 13.7239 9.5 14 9.5C14.2761 9.5 14.5 9.72386 14.5 10V12.6667C14.5 13.1529 14.3068 13.6192 13.963 13.963C13.6192 14.3068 13.1529 14.5 12.6667 14.5H3.33333C2.8471 14.5 2.38079 14.3068 2.03697 13.963C1.69315 13.6192 1.5 13.1529 1.5 12.6667V10C1.5 9.72386 1.72386 9.5 2 9.5Z"
                          fill="#59B2FF"
                        />
                      </svg>
                      Selecionar</label
                    >
                    <span class="file-name">Nenhum arquivo selecionado</span>
                  </div>
                </div>
              </div>
            </fieldset>

            <div class="icon-title">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  fill-rule="evenodd"
                  clip-rule="evenodd"
                  d="M8 1.25C8.41421 1.25 8.75 1.58579 8.75 2V3.25H15.25V2C15.25 1.58579 15.5858 1.25 16 1.25C16.4142 1.25 16.75 1.58579 16.75 2V3.25H19C20.5188 3.25 21.75 4.48122 21.75 6V20C21.75 21.5188 20.5188 22.75 19 22.75H5C3.48122 22.75 2.25 21.5188 2.25 20V6C2.25 4.48122 3.48122 3.25 5 3.25H7.25V2C7.25 1.58579 7.58579 1.25 8 1.25ZM5 4.75C4.30964 4.75 3.75 5.30964 3.75 6V20C3.75 20.6904 4.30964 21.25 5 21.25H19C19.6904 21.25 20.25 20.6904 20.25 20V6C20.25 5.30964 19.6904 4.75 19 4.75H5ZM12 8.75C11.3096 8.75 10.75 9.30964 10.75 10C10.75 10.6904 11.3096 11.25 12 11.25C12.6904 11.25 13.25 10.6904 13.25 10C13.25 9.30964 12.6904 8.75 12 8.75ZM9.25 10C9.25 8.48122 10.4812 7.25 12 7.25C13.5188 7.25 14.75 8.48122 14.75 10C14.75 11.5188 13.5188 12.75 12 12.75C10.4812 12.75 9.25 11.5188 9.25 10ZM7.05546 16.0555C7.57118 15.5397 8.27065 15.25 9 15.25H15C15.7293 15.25 16.4288 15.5397 16.9445 16.0555C17.4603 16.5712 17.75 17.2707 17.75 18C17.75 18.4142 17.4142 18.75 17 18.75C16.5858 18.75 16.25 18.4142 16.25 18C16.25 17.6685 16.1183 17.3505 15.8839 17.1161C15.6495 16.8817 15.3315 16.75 15 16.75H9C8.66848 16.75 8.35054 16.8817 8.11612 17.1161C7.8817 17.3505 7.75 17.6685 7.75 18C7.75 18.4142 7.41421 18.75 7 18.75C6.58579 18.75 6.25 18.4142 6.25 18C6.25 17.2707 6.53973 16.5712 7.05546 16.0555Z"
                  fill="#869198"
                />
              </svg>
              <span>Dados para contato</span>
            </div>
            <fieldset class="contact">
              <div class="input-wrapper">
                <label for="name">Nome</label>
                <input
                  id="name"
                  type="text"
                  placeholder="Nome completo"
                  required
                />
                <div class="error">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 16 16"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      fill-rule="evenodd"
                      clip-rule="evenodd"
                      d="M8.00004 1.83331C4.59428 1.83331 1.83337 4.59422 1.83337 7.99998C1.83337 11.4057 4.59428 14.1666 8.00004 14.1666C11.4058 14.1666 14.1667 11.4057 14.1667 7.99998C14.1667 4.59422 11.4058 1.83331 8.00004 1.83331ZM0.833374 7.99998C0.833374 4.04194 4.042 0.833313 8.00004 0.833313C11.9581 0.833313 15.1667 4.04194 15.1667 7.99998C15.1667 11.958 11.9581 15.1666 8.00004 15.1666C4.042 15.1666 0.833374 11.958 0.833374 7.99998ZM8.00004 4.83331C8.27618 4.83331 8.50004 5.05717 8.50004 5.33331V7.99998C8.50004 8.27612 8.27618 8.49998 8.00004 8.49998C7.7239 8.49998 7.50004 8.27612 7.50004 7.99998V5.33331C7.50004 5.05717 7.7239 4.83331 8.00004 4.83331ZM7.50004 10.6666C7.50004 10.3905 7.7239 10.1666 8.00004 10.1666H8.00671C8.28285 10.1666 8.50671 10.3905 8.50671 10.6666C8.50671 10.9428 8.28285 11.1666 8.00671 11.1666H8.00004C7.7239 11.1666 7.50004 10.9428 7.50004 10.6666Z"
                      fill="#FF5959"
                    />
                  </svg>

                  <small>Campo obrigatório</span>
                </div>
              </div>

              <div class="data-columns">
                <div class="data">
                  <label for="mail">E-mail</label>
                  <input
                    id="mail"
                    type="text"
                    placeholder="exemplo@email.com"
                  />
                </div>

                <div class="data">
                  <label for="phone">Telefone</label>
                  <input id="phone" type="text" placeholder="(99) 99999-9999" />
                </div>
              </div>
            </fieldset>

             <footer>
              <div class="terms-wrapper input-wrapper checkbox-wrapper">
                <div class="terms-1">
                  <div class="checkbox-image"></div>
                  <input type="checkbox" name="terms-1" id="terms">
                  <label for="terms-1">Li e concordo com os <strong>Termos e Condições</strong> e com a <strong>Política de Privacidade</strong></label>
                </div>
                <div class="terms-2">
                  <div class="checkbox-image"></div>
                  <input type="checkbox" name="terms-2" id="terms">
                  <label for="terms-2">Aceito receber atualizações e promoções por e-mail</label>
                </div>
                <div class="terms-3">
                  <div class="checkbox-image"></div>
                  <input type="checkbox" name="terms-3" id="terms">
                  <label for="terms-3">Aceito receber atualizações e promoções por SMS</label>
                </div>
                
              </div>
            </footer>
           
          </form>
        </div>
      </main>
    </div>
  </body>
</html>
